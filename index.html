<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NCC Cadet Learning Platform</title>

  <script>
    (function() {
      const isGithubPages = window.location.hostname.endsWith('github.io');
      const segments = window.location.pathname.split('/').filter(Boolean);
      const basePath = isGithubPages && segments.length > 0 ? `/${segments[0]}/` : '/';
      const baseTag = document.createElement('base');
      baseTag.href = basePath;
      document.head.appendChild(baseTag);
      window.__APP_BASE_PATH__ = basePath;
      window.__APP_START_TIME__ = Date.now();

      if (!window.location.hash) {
        const relativePath = window.location.pathname.startsWith(basePath)
          ? `/${window.location.pathname.slice(basePath.length).replace(/^\/+/, '')}`
          : window.location.pathname;
        const routeCandidate = relativePath === '/index.html'
          ? '/'
          : (relativePath.length > 1 ? relativePath.replace(/\/+$/, '') : relativePath);
        const looksLikeAsset = /\.[a-z0-9]+$/i.test(routeCandidate);

        if (routeCandidate !== '/' && !looksLikeAsset) {
          window.history.replaceState(null, '', `${basePath}#${routeCandidate}${window.location.search}`);
        }
      }
    })();
  </script>
  
  <link rel="icon" href="./assets/icons/icon-192x192.png" type="image/png">
  <link rel="apple-touch-icon" href="./assets/icons/icon-192x192.png">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0A84FF">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/themes.css">

  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    @keyframes skeleton-pulse {
        0% { background-color: #1E293B; }
        50% { background-color: #334155; }
        100% { background-color: #1E293B; }
    }

    .skeleton {
        animation: skeleton-pulse 1.5s ease-in-out infinite;
        border-radius: 8px;
        display: block;
    }

    .skeleton-text { height: 1rem; margin-bottom: 0.5rem; width: 100%; }
    .skeleton-title { height: 2rem; margin-bottom: 1rem; width: 60%; }
    .skeleton-card { height: 120px; width: 100%; margin-bottom: 1rem; }
  </style>

  <script>
    const theme = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', theme);
  </script>

  <!-- PWA Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        // Use relative path so GitHub Pages scope resolves correctly
        navigator.serviceWorker.register('./sw.js')
          .then(registration => console.log('SW registered: ', registration.scope))
          .catch(error => console.log('SW registration failed: ', error));
      });
    }
  </script>

  <!-- PWA Forced-Install Gate -->
  <script src="./js/components/InstallGate.js" defer></script>
</head>
<body style="overflow: hidden; margin: 0; background-color: #000000; background: #000000;">
  
  <style>
    @import url(https://fonts.googleapis.com/css?family=Quattrocento+Sans);

    .loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      z-index: 999999; /* Higher than InstallGate */
      transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.4s;
    }

    .loading-text {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      right: 0;
      margin: auto;
      text-align: center;
      width: 100%;
      height: 100px;
      line-height: 100px;
    }

    .loading-text span {
      display: inline-block;
      margin: 0 5px;
      color: #fff;
      font-family: 'Quattrocento Sans', sans-serif;
      font-size: 2rem;
      letter-spacing: 5px;
    }

    /* Simplified fade-in animation instead of blur which breaks on some mobile WebKit engines */
    .loading-text span { opacity: 0; animation: fade-in-text 1.5s infinite linear alternate; }
    .loading-text span:nth-child(1) { animation-delay: 0s; }
    .loading-text span:nth-child(2) { animation-delay: 0.2s; }
    .loading-text span:nth-child(3) { animation-delay: 0.4s; }
    .loading-text span:nth-child(4) { animation-delay: 0.6s; }
    .loading-text span:nth-child(5) { animation-delay: 0.8s; }
    .loading-text span:nth-child(6) { animation-delay: 1.0s; }
    .loading-text span:nth-child(7) { animation-delay: 1.2s; }

    @keyframes fade-in-text {
      0% { opacity: 0.2; transform: scale(0.9); }
      100% { opacity: 1; transform: scale(1.1); }
    }
  </style>

  <div id="global-loader" class="loading">
    <div class="loading-text">
      <span class="loading-text-words">L</span>
      <span class="loading-text-words">O</span>
      <span class="loading-text-words">A</span>
      <span class="loading-text-words">D</span>
      <span class="loading-text-words">I</span>
      <span class="loading-text-words">N</span>
      <span class="loading-text-words">G</span>
    </div>
    <div id="screen-error" style="display: none; position: absolute; bottom: 20px; left: 20px; color: #EF4444; z-index: 1000000; font-family: monospace; text-align: left; background: rgba(0,0,0,0.8); padding: 10px; border-radius: 4px; max-width: 90%; word-wrap: break-word; font-size: 12px;"></div>
  </div>

  <header id="nav-root"></header>
  <main id="app-root"></main>

  <script type="module" src="./js/components/navbar.js"></script>
  <script>
    window.addEventListener('error', function(e) {
      const loaderStatus = document.getElementById('loader-status');
      const screenError = document.getElementById('screen-error');
      if (loaderStatus) {
        loaderStatus.innerText = 'Fatal Crash Detected 🚨';
        loaderStatus.style.color = '#EF4444';
      }
      if (screenError) {
        screenError.style.display = 'block';
        screenError.innerHTML += e.message + '<br><br>Check File: ' + (e.filename || 'Path mismatch/Missing file') + '<br>';
      }
      window.__HAS_ERROR__ = true;
    }, true);
  </script>

  <script type="module" src="./js/core/app.js"></script>

</body>
</html>
